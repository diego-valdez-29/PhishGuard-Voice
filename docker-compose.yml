version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phishguard-backend
    ports:
      - "8000:8000"
    environment:
      - TARGET_SAMPLE_RATE=16000
      - CONFIDENCE_THRESHOLD=0.75
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phishguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
